<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU-Farewell 2K26</title>
</head>
<body>
    <h1>Concert Ticket Registration Form</h1>
    <form>
        <h3>Name</h3>
        <input type="text">
        <h3>Email</h3>
        <input type="email">
        <h3>Phone</h3>
        <input type="tel">
        <h3>Please Select one</h3>
        <select>
            <input type="radio">
            male
            <input type="radio">
            female
            <input type="radio">
            others
        </select>
        <h3>Please select T-Shirt Size</h3>
        <input type="checkbox">
        XXL
        <input type="checkbox">
        XL
        <input type="checkbox">
        L
        <input type="checkbox">
        M
        <h3>Please Select a date</h3>
        <input type="date">
    </form>
</body>
</html>
